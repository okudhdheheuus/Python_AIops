{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "itops.fullname" . }}-backend-config
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_FORMAT: {{ .Values.backend.logFormat | quote }}
  LOG_LEVEL: {{ .Values.backend.logLevel | quote }}
  CORS_ORIGINS: "http://{{ .Values.ingress.host }}"
  REDIS_HOST: {{ include "itops.fullname" . }}-redis
  REDIS_PORT: "6379"
  LLM_PROVIDER: "glm"
  OPENAI_API_BASE: "https://open.bigmodel.cn/api/paas/v4"
  OPENAI_MODEL: "glm-4-flash"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "itops.fullname" . }}-backend-secret
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  GLM_API_KEY: {{ .Values.secrets.glmApiKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "itops.fullname" . }}-backend
spec:
  selector:
    app: {{ include "itops.fullname" . }}-backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itops.fullname" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "itops.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "itops.fullname" . }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            - name: DATABASE_URL
              value: {{ include "itops.postgres-url" . | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "itops.fullname" . }}-backend-config
            - secretRef:
                name: {{ include "itops.fullname" . }}-backend-secret
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.backend.service.port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.backend.service.port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- with .Values.backend.startupProbe }}
          startupProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.backend.service.port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
{{- end }}