services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: itops
      POSTGRES_PASSWORD: itops123
      POSTGRES_DB: itops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: crpi-0pts6ks97slw904m.cn-chengdu.personal.cr.aliyuncs.com/itops/itops-backend:main
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      SECRET_KEY: your-production-secret-key-change-me
      DATABASE_URL: postgresql+asyncpg://itops:itops123@postgres:5432/itops
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGINS: "http://localhost:3000,http://8.137.178.63:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: crpi-0pts6ks97slw904m.cn-chengdu.personal.cr.aliyuncs.com/itops/itops-frontend:main
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
