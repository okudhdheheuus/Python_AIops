services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: itops
      POSTGRES_PASSWORD: itops123
      POSTGRES_DB: itops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      SECRET_KEY: change-me-in-production-use-openssl-rand-hex-32
      DATABASE_URL: postgresql+asyncpg://itops:itops123@postgres:5432/itops
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGINS: "http://localhost:3000"
      GLM_API_KEY: ""
      HF_ENDPOINT: https://hf-mirror.com
      HF_HOME: /app/.cache/huggingface
    volumes:
      - model_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: frontend-next
      dockerfile: Dockerfile
    environment:
      BACKEND_HOST: backend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  model_cache:
