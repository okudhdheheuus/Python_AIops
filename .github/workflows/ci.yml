name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ========== 后端 ==========
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itops
          POSTGRES_PASSWORD: itops123
          POSTGRES_DB: itops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check . --ignore E501

      - name: Run tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          SECRET_KEY: ci-test-secret
          ENVIRONMENT: test
          CORS_ORIGINS: "*"
        run: pytest ../tests/ -v --tb=short

  # ========== 前端 ==========
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-next

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ========== Docker 镜像构建（仅验证，不推送） ==========
  docker-build:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-next
          file: frontend-next/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
