
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: itops
data:
  ENVIRONMENT: "production"
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "http://localhost:30080"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: itops
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: itops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: itops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://itops:itops123@postgres:5432/itops"
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # 最多等 60 秒启动
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: itops
type: Opaque
stringData:
  SECRET_KEY: "change-me-in-production-use-a-real-secret"
  LLM_PROVIDER: "openai"
  DEEPSEEK_API_KEY: ""
  OPENAI_API_KEY: "sk-2f3a1ee4618642c8a4eb32753353556e"
  OPENAI_API_BASE: "https://open.bigmodel.cn/api/paas/v4"
  OPENAI_MODEL: "glm-4.7-flash"

