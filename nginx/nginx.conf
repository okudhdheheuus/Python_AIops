
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;

    # Docker 内网 DNS resolver，variable proxy_pass 强制运行时解析（避免启动时 backend 未就绪报 host not found）
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;

        # API 代理到后端
        location /api/ {
            set $backend_api "http://backend:8000";
            proxy_pass $backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $connection-$connection_requests;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /health/ {
            set $backend_health "http://backend:8000";
            proxy_pass $backend_health;
        }

        location /metrics {
            set $backend_metrics "http://backend:8000";
            proxy_pass $backend_metrics;
        }

        # 其他请求到前端
        location / {
            set $frontend_url "http://frontend:3000";
            proxy_pass $frontend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}